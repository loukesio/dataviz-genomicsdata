[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "genomicsviz"
version = "0.1.0"
description = "Python toolkit for genomics data visualization — 2026 course"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Loukas Theodosiou", email = "loukesio@gmail.com" }
]
keywords = ["genomics", "bioinformatics", "visualization", "matplotlib", "seaborn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    # ── Core numerics & data ─────────────────────────────────────────────────
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    # ── Plotting foundations ─────────────────────────────────────────────────
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    # ── Dimensionality reduction ─────────────────────────────────────────────
    "umap-learn>=0.5",
    # ── Genomics-specific ────────────────────────────────────────────────────
    "biopython>=1.83",
    "scanpy>=1.9",
    "toytree>=3.0",
    "pycirclize>=1.3",
    "pymsaviz>=0.4",
    "gget>=0.28",
    # ── Rich annotations & heatmaps ─────────────────────────────────────────
    "PyComplexHeatmap>=1.6",
    # ── Specialized chart types ──────────────────────────────────────────────
    "matplotlib-venn>=0.11",
    "upsetplot>=0.9",
    "pywaffle>=1.0",
    "adjustText>=1.0",
]

[project.urls]
Homepage = "https://github.com/loukesio/dataviz-genomicsdata"
Repository = "https://github.com/loukesio/dataviz-genomicsdata"

[tool.setuptools.packages.find]
where = ["."]
include = ["genomicsviz*"]
