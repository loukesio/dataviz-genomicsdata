[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genomics_course"
version = "0.1.0"
description = "Teaching datasets and styled plots for the genomics course"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.6",
    "numpy",
    "pandas",
    "pyarrow",
    "seaborn",
    "scipy",
    "scikit-learn",
    "plotly",
    "adjustText",
    "biopython",
    "gget",
    "networkx",
    "pyCirclize",
    "PyComplexHeatmap",
    "pywaffle",
    "scanpy",
    "ternary-diagram",
    "toytree",
    "umap-learn",
    "squarify",
    "pypalettes",
    "datashader",
    "bokeh",
    "holoviews",
    "scikit-image",
    "colorcet",
    "pyMSAviz",
    "dash-bio",
    "pyGenomeTracks",
    "dna_features_viewer",
    "jcvi",
    "upsetplot",
]

[tool.setuptools.packages.find]
where = ["genomics_course"]

[tool.setuptools.package-data]
genomics_course = ["data/files/*.parquet"]
